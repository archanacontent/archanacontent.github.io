<text x="40" y="58" class="h" font-size="26">Working back from an</text><text x="40" y="90" class="h" font-size="26">NIH SBIR due date</text><line x1="62" y1="140" x2="62" y2="660" stroke="#22D3EE" stroke-opacity=".55" stroke-width="3"/><circle cx="62" cy="150" r="12" fill="#0b0d1a" stroke="#22D3EE" stroke-width="3"/><text x="100" y="156" class="k" font-size="16">6+ WEEKS BEFORE</text><text x="100" y="192" class="h" font-size="25">Start registrations</text><text x="100" y="224" class="m" font-size="19">SAM.gov, SBA Company Registry,</text><text x="100" y="250" class="m" font-size="19">eRA Commons, Grants.gov</text><circle cx="62" cy="320" r="12" fill="#0b0d1a" stroke="#22D3EE" stroke-width="3"/><text x="100" y="326" class="k" font-size="16">3 BUSINESS DAYS BEFORE</text><text x="100" y="362" class="h" font-size="25">Submit the application</text><text x="100" y="394" class="m" font-size="19">Leaves time to fix errors</text><text x="100" y="420" class="m" font-size="19">the systems flag</text><circle cx="62" cy="490" r="12" fill="#0b0d1a" stroke="#22D3EE" stroke-width="3"/><text x="100" y="496" class="k" font-size="16">AFTER SUBMITTING</text><text x="100" y="532" class="h" font-size="25">Check it in eRA Commons</text><text x="100" y="564" class="m" font-size="19">View the assembled application</text><text x="100" y="590" class="m" font-size="19">page by page</text><circle cx="62" cy="660" r="12" fill="#FF7A45" stroke="#22D3EE" stroke-width="3"/><text x="100" y="666" class="k" font-size="16">DUE DATE</text><text x="100" y="702" class="h" font-size="25">5:00 PM local time</text><text x="100" y="734" class="m" font-size="19">No late applications</text><text x="100" y="760" class="m" font-size="19">for any personal reason</text><text x="40" y="830" class="m" font-size="15">Sources: NIH PA-27-100, NOT-OD-26-064</text></svg>