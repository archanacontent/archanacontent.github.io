<style>text{font-family:'Public Sans',Arial,sans-serif;fill:#EEF1F8}.h{font-family:'Archivo',Arial,sans-serif;font-weight:700}.m{fill:rgba(238,241,248,.66)}.k{font-family:'Archivo',Arial,sans-serif;font-weight:700;letter-spacing:2px;fill:#6dd3a6}</style>
<text x="48" y="64" class="k" font-size="17">FIVE SCORES, ONE OVERALL IMPACT SCORE</text><rect x="48" y="100" width="430" height="70" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/><text x="72" y="132" class="h" font-size="25">Significance</text><text x="72" y="158" class="m" font-size="19">Does it meet an unmet need?</text><path d="M480 135 C 600 135, 620 315, 700 315" fill="none" stroke="#8ea9e8" stroke-opacity=".55" stroke-width="2" marker-end="url(#ar)"/><rect x="48" y="188" width="430" height="70" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/><text x="72" y="220" class="h" font-size="25">Investigators</text><text x="72" y="246" class="m" font-size="19">Can this team deliver it?</text><path d="M480 223 C 600 223, 620 315, 700 315" fill="none" stroke="#8ea9e8" stroke-opacity=".55" stroke-width="2" marker-end="url(#ar)"/><rect x="48" y="276" width="430" height="70" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/><text x="72" y="308" class="h" font-size="25">Innovation</text><text x="72" y="334" class="m" font-size="19">What is its advantage?</text><path d="M480 311 C 600 311, 620 315, 700 315" fill="none" stroke="#8ea9e8" stroke-opacity=".55" stroke-width="2" marker-end="url(#ar)"/><rect x="48" y="364" width="430" height="70" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/><text x="72" y="396" class="h" font-size="25">Approach</text><text x="72" y="422" class="m" font-size="19">Will the plan work?</text><path d="M480 399 C 600 399, 620 315, 700 315" fill="none" stroke="#8ea9e8" stroke-opacity=".55" stroke-width="2" marker-end="url(#ar)"/><rect x="48" y="452" width="430" height="70" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/><text x="72" y="484" class="h" font-size="25">Environment</text><text x="72" y="510" class="m" font-size="19">Are the resources in place?</text><path d="M480 487 C 600 487, 620 315, 700 315" fill="none" stroke="#8ea9e8" stroke-opacity=".55" stroke-width="2" marker-end="url(#ar)"/><rect x="710" y="235" width="440" height="160" rx="18" fill="rgba(109,211,166,.12)" stroke="url(#g)" stroke-width="2"/><text x="740" y="292" class="h" font-size="30">Overall impact score</text><text x="740" y="330" class="m" font-size="20">Weighs all five, plus the Commercialization</text><text x="740" y="360" class="m" font-size="20">Plan for Phase II and Fast-Track</text><text x="48" y="568" class="m" font-size="17">Source: NIH PA-27-100, Section V. Application Review Information</text></svg>