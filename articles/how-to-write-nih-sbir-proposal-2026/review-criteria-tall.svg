<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8ea9e8"/></marker></defs>
<rect width="600" height="840" rx="22" fill="#141c2d"/>
<style>text{font-family:'Public Sans',Arial,sans-serif;fill:#EEF1F8}.h{font-family:'Archivo',Arial,sans-serif;font-weight:700}.m{fill:rgba(238,241,248,.66)}.k{font-family:'Archivo',Arial,sans-serif;font-weight:700;letter-spacing:2px;fill:#6dd3a6}</style>
<text x="40" y="60" class="k" font-size="15">FIVE SCORES, ONE OVERALL IMPACT SCORE</text><rect x="40" y="90" width="520" height="78" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/><text x="64" y="124" class="h" font-size="25">Significance</text><text x="64" y="152" class="m" font-size="19">Does it meet an unmet need?</text><rect x="40" y="186" width="520" height="78" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/><text x="64" y="220" class="h" font-size="25">Investigators</text><text x="64" y="248" class="m" font-size="19">Can this team deliver it?</text><rect x="40" y="282" width="520" height="78" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/><text x="64" y="316" class="h" font-size="25">Innovation</text><text x="64" y="344" class="m" font-size="19">What is its advantage?</text><rect x="40" y="378" width="520" height="78" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/><text x="64" y="412" class="h" font-size="25">Approach</text><text x="64" y="440" class="m" font-size="19">Will the plan work?</text><rect x="40" y="474" width="520" height="78" rx="12" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/><text x="64" y="508" class="h" font-size="25">Environment</text><text x="64" y="536" class="m" font-size="19">Are the resources in place?</text><path d="M300 572 L300 610" stroke="#8ea9e8" stroke-width="2.5" marker-end="url(#ar)"/><rect x="40" y="622" width="520" height="150" rx="18" fill="rgba(109,211,166,.12)" stroke="url(#g)" stroke-width="2"/><text x="64" y="678" class="h" font-size="30">Overall impact score</text><text x="64" y="714" class="m" font-size="19">Weighs all five, plus the Commercialization</text><text x="64" y="740" class="m" font-size="19">Plan for Phase II and Fast-Track</text><text x="40" y="812" class="m" font-size="15">Source: NIH PA-27-100</text></svg>